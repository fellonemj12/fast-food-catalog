<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Food Ordering Catalog</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Top Decorative Header Pattern -->
  <header class="top-pattern"></header>

  <!-- Main Container -->
  <main class="container">
    <h1 class="title">Menu Catalog</h1>
    <div id="catalog" class="catalog-grid"></div>
  </main>

  <!-- Dynamic Cart Bar -->
  <footer class="cart-bar">
    <div class="cart-info">
      <span><i class="fa-solid fa-cart-shopping"></i> Total Items: <strong id="total-items">0</strong></span>
      <span>Total Price: <strong id="total-price">$0.00</strong></span>
    </div>
    <button class="checkout-btn" onclick="checkout()">Checkout</button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
